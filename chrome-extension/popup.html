<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cortex</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: #f7f1e6;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: #2a241d;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #d8cdb9;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: #1a1a1a;
      flex-shrink: 0;
    }

    .brand-name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .tab-hint {
      margin-left: auto;
      font-size: 10px;
      color: #9b8d7d;
      font-family: 'Courier New', monospace;
    }

    .form { padding: 12px 16px 16px; }

    .type-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .type-btn {
      flex: 1;
      padding: 5px 0;
      border-radius: 6px;
      border: 1px solid #d8cdb9;
      background: #fcf8f0;
      color: #6c5e4e;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    .type-btn[data-active="true"] {
      background: #1a1a1a;
      border-color: #1a1a1a;
      color: #f7f1e6;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      padding: 9px 11px;
      border: 1px solid #d8cdb9;
      border-radius: 8px;
      background: #fcf8f0;
      font-family: inherit;
      font-size: 13px;
      color: #2a241d;
      outline: none;
      line-height: 1.5;
    }

    textarea:focus { border-color: #3d4691; box-shadow: 0 0 0 3px rgba(61,70,145,0.15); }
    textarea::placeholder { color: #9b8d7d; }

    .url-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .url-label { font-size: 11px; color: #9b8d7d; white-space: nowrap; }

    .url-input {
      flex: 1;
      padding: 5px 9px;
      border: 1px solid #d8cdb9;
      border-radius: 6px;
      background: #fcf8f0;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #2a241d;
      outline: none;
      min-width: 0;
    }

    .url-input:focus { border-color: #3d4691; }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-save {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      border: none;
      background: #1a1a1a;
      color: #f7f1e6;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-save:hover { background: #2a241d; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-tab {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #d8cdb9;
      background: #fcf8f0;
      color: #6c5e4e;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .btn-tab:hover { background: #ede5d3; }

    .status {
      padding: 10px 16px;
      font-size: 12px;
      border-top: 1px solid #d8cdb9;
      display: none;
    }

    .status[data-type="ok"] { color: #3a8c91; display: block; }
    .status[data-type="err"] { color: #c64a3d; display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-dot"></div>
    <span class="brand-name">Cortex</span>
    <span class="tab-hint" id="tab-hint"></span>
  </div>

  <div class="form">
    <div class="type-row">
      <button class="type-btn" data-type="idea" data-active="true" id="btn-idea">Idea</button>
      <button class="type-btn" data-type="link" data-active="false" id="btn-link">Link</button>
    </div>

    <textarea id="text-input" placeholder="What's on your mind?" autofocus></textarea>

    <div class="url-row" id="url-row" style="display:none">
      <span class="url-label">URL</span>
      <input class="url-input" id="url-input" type="url" placeholder="https://…" />
    </div>

    <div class="actions">
      <button class="btn-save" id="btn-save">Add to Inbox</button>
      <button class="btn-tab" id="btn-save-tab" title="Save current tab as a link" style="display:none">+ Tab</button>
    </div>
  </div>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
